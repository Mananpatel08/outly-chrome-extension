<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell" id="app-root">
    <!-- Header -->
    <header class="header" id="main-header" style="display: none;">
      <div class="header-left">
        <div class="outly-logo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span class="logo-text">Outly</span>
        </div>
      </div>
      <div class="header-right">
        <div class="employee-badge">Manan · 96</div>
        <button class="reset-button icon-button" id="btn-theme-toggle" aria-label="Toggle Theme" style="margin-right: 4px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        </button>
        <button class="reset-button icon-button" id="btn-show-reset" aria-label="Reset Profile">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Screen 1: Setup -->
      <section class="screen" id="screen-setup">
        <div class="setup-header auth-header">
          <h1 class="auth-title">Welcome to Outly</h1>
          <p class="auth-subtitle">Set up your employee profile to get started</p>
        </div>
        
        <form class="setup-form" id="setup-form">
          <div class="form-group">
            <label for="emp-id">Employee ID</label>
            <input type="number" id="emp-id" placeholder="e.g. 96" class="input-field">
          </div>
          <div class="form-group">
            <label for="emp-name">Full Name</label>
            <input type="text" id="emp-name" placeholder="e.g. Manan" class="input-field">
          </div>
          <div class="form-group">
            <label for="emp-code">Employee Code</label>
            <input type="text" id="emp-code" placeholder="e.g. EMP001" class="input-field">
          </div>
          
          <div class="auth-actions">
            <button type="button" class="btn-auth" id="btn-save-setup">Save & Continue</button>
          </div>
        </form>
      </section>

      <!-- Screen 2: Main State (Default, Full Day, Short Leave) -->
      <section class="screen" id="screen-main" style="display: none;">
        
        <!-- Custom Horizontal Date Picker -->
        <div class="date-picker-container">
          <div class="date-picker-scroll">
            <button class="date-pill">
              <span class="date-day">MON</span>
              <span class="date-num">12</span>
            </button>
            <button class="date-pill">
              <span class="date-day">TUE</span>
              <span class="date-num">13</span>
            </button>
            <button class="date-pill active">
              <span class="date-day">WED</span>
              <span class="date-num">14</span>
            </button>
            <button class="date-pill">
              <span class="date-day">THU</span>
              <span class="date-num">15</span>
            </button>
            <button class="date-pill">
              <span class="date-day">FRI</span>
              <span class="date-num">16</span>
            </button>
          </div>
          <button class="calendar-icon-btn" id="btn-open-calendar" aria-label="Pick date" style="position: relative;">
            <input type="date" id="native-date-picker" style="position: absolute; opacity: 0; width: 100%; height: 100%; top: 0; left: 0; cursor: pointer; border: none; padding: 0;" />
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          </button>
        </div>

        <div class="leave-type-section">
          <span class="section-label">LEAVE TYPE</span>
          <div class="segmented-control">
            <button class="segment active" data-value="full-day">Full Day</button>
            <button class="segment" data-value="half-day">Half Day</button>
            <button class="segment" data-value="short-leave">Short Leave</button>
          </div>
        </div>

        <!-- Short Leave Duration Input (Hidden by default) -->
        <div class="short-leave-duration" id="short-leave-input-area" style="display: none;">
          <span class="section-label">SHORT LEAVE DURATION</span>
          <div class="time-picker-container">
            <div class="time-picker-group">
              <input type="number" min="0" max="8" value="01" class="time-input" id="sl-hours">
              <span class="time-label">hrs</span>
            </div>
            <span class="time-separator">:</span>
            <div class="time-picker-group">
              <input type="number" min="0" max="59" value="30" step="15" class="time-input" id="sl-mins">
              <span class="time-label">min</span>
            </div>
          </div>
        </div>

        <div class="action-section">
          <button class="btn-primary full-width" id="btn-calculate">Calculate Leaving Time</button>
          
          <div class="empty-state-card" id="empty-state-box">
            <span class="empty-icon">⏳</span>
            <p>Select your leave type and click calculate to see your leaving time.</p>
          </div>
        </div>

        <!-- Results Area -->
        <div class="result-area" id="result-area" style="display: none;">
          <!-- Will be populated by JS based on state -->
        </div>

      </section>

    </main>

    <!-- Modals -->
    <div class="modal-overlay" id="reset-modal" style="display: none;">
      <div class="modal-card">
        <h3 class="modal-title">Reset employee profile?</h3>
        <p class="modal-desc">This will clear your saved employee information.</p>
        <div class="modal-actions">
          <button class="btn-secondary" id="btn-cancel-reset">Cancel</button>
          <button class="btn-destructive" id="btn-confirm-reset">Reset Profile</button>
        </div>
      </div>
    </div>
    

  </div>

  <script src="app.js"></script>
</body>
</html>
